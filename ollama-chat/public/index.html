<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      background: #2a2a4a;
      color: #aaa;
    }

    .status.online { background: #1a4a2e; color: #4ade80; }
    .status.error { background: #4a1a1a; color: #f87171; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .assistant {
      align-self: flex-start;
      background: #1e1e3a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 12px;
      text-align: center;
    }

    #input-area {
      padding: 16px 20px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 12px;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      background: #0f0f23;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    #input:focus {
      border-color: #2563eb;
    }

    #input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #666;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .clear-btn {
      background: transparent;
      border: 1px solid #2a2a4a;
      color: #888;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      border-color: #f87171;
      color: #f87171;
    }
  </style>
</head>
<body>
  <header>
    <h1>LLM Chat — llama3.2:3b</h1>
    <div style="display: flex; gap: 12px; align-items: center;">
      <button class="clear-btn" onclick="clearChat()">Clear</button>
      <span class="status" id="status">Checking...</span>
    </div>
  </header>

  <div id="chat"></div>

  <div id="input-area">
    <input id="input" placeholder="Введите сообщение..." autocomplete="off" />
    <button id="send">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');

    let messages = [];
    let isGenerating = false;

    // Check Ollama health
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        status.textContent = `Online — ${data.model}`;
        status.className = 'status online';
      } catch {
        status.textContent = 'Offline';
        status.className = 'status error';
      }
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function addTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message assistant typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || isGenerating) return;

      input.value = '';
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      isGenerating = true;
      sendBtn.disabled = true;
      input.disabled = true;
      addTypingIndicator();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        removeTypingIndicator();

        if (!response.ok) {
          const error = await response.json();
          addMessage('system', `Error: ${error.error || 'Unknown error'}`);
          return;
        }

        const data = await response.json();
        const assistantMessage = data.message?.content || data.response || 'No response';

        addMessage('assistant', assistantMessage);
        messages.push({ role: 'assistant', content: assistantMessage });

      } catch (err) {
        removeTypingIndicator();
        addMessage('system', `Connection error: ${err.message}`);
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function clearChat() {
      messages = [];
      chat.innerHTML = '';
      addMessage('system', 'Chat cleared');
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Init
    checkHealth();
    input.focus();
  </script>
</body>
</html>
